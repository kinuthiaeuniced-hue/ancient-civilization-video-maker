<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The World Before Us — AI Documentary Studio</title><style>body{margin:0;background:#0b1020;color:#eef2ff;font-family:Arial,sans-serif}header{padding:28px;background:#111936;border-bottom:1px solid #293553}.brand{max-width:1100px;margin:auto;display:flex;gap:14px;align-items:center}.logo{font-size:35px;background:#d9a441;padding:10px;border-radius:12px}main{max-width:1100px;margin:25px auto;padding:0 16px}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.card{background:#11182b;border:1px solid #293553;border-radius:16px;padding:20px}label{display:block;margin:15px 0 6px;color:#b9c3dc;font-size:13px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #394663;background:#0b1122;color:white}textarea{min-height:130px}.primary,.tab,.secondary{border:0;border-radius:9px;padding:11px 14px;cursor:pointer;font-weight:bold}.primary{width:100%;margin-top:18px;background:#d9a441;color:#15100a}.tab,.secondary{background:#222d49;color:white}.tab.active{background:#d9a441;color:#15100a}.tabs,.actions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.output{white-space:pre-wrap;line-height:1.6;min-height:520px;color:#e6eaff}.status{margin-top:12px;padding:10px;background:#0b1122;border-radius:9px;color:#aeb8d4;font-size:13px}.empty{text-align:center;padding:150px 20px;color:#8792ad}@media(max-width:800px){.grid{grid-template-columns:1fr}.output{min-height:400px}}</style></head><body><header><div class="brand"><div class="logo">🏛️</div><div><h1>The World Before Us</h1><div>AI Ancient Civilization Documentary Studio • Version 2</div></div></div></header><main><div class="grid"><section class="card"><h2>🎬 Documentary Builder</h2><label>Documentary title / topic</label><input id="topic" value="The Forgotten African Kingdom That Conquered Egypt"><label>Target length</label><select id="length"><option>15</option><option selected>20</option><option>30</option><option>45</option><option>60</option></select><label>Style</label><select id="style"><option>Cinematic historical documentary</option><option>Epic archaeological mystery</option><option>Educational documentary</option><option>Dark historical mystery</option></select><label>Research notes</label><textarea id="notes">Kush, Nubia, Piye, Dynasty 25, Taharqa, Assyria, Meroë, Kushite culture, royal women, Amanirenas and Rome, decline and legacy. Treat uncertain details carefully.</textarea><button class="primary" onclick="generate()">✨ Generate Documentary Package</button><div id="status" class="status">Ready.</div></section><section class="card"><div class="tabs"><button class="tab active" onclick="tab('script',this)">📜 Script</button><button class="tab" onclick="tab('scenes',this)">🎞️ Scenes</button><button class="tab" onclick="tab('visuals',this)">🖼️ Visuals</button><button class="tab" onclick="tab('audio',this)">🎙️ Audio</button><button class="tab" onclick="tab('plan',this)">📋 Plan</button></div><div class="actions"><button class="secondary" onclick="copyText()">Copy</button><button class="secondary" onclick="downloadText()">Download TXT</button></div><div id="output" class="output"><div class="empty"><h2>🏺 Your documentary will appear here</h2><p>Enter a topic and click Generate.</p></div></div></section></div></main><script>let D={},current='script';function v(id){return document.getElementById(id).value.trim()}function generate(){D.topic=v('topic');D.length=v('length');D.style=v('style');D.notes=v('notes');if(!D.topic)return alert('Enter a topic first.');D.scenes=['Opening — The Lost World','Geography & Origins','Rise of Power','Conflict & Conquest','People & Culture','Cities & Trade','Royal Women & Leadership','Decline & Transformation','Legacy & Discovery'].map((x,i)=>({title:x,num:i+1}));D.script=`DOCUMENTARY TITLE\n${D.topic}\n\nFORMAT\n${D.length}-minute ${D.style}\n\nOPENING HOOK\nWhat if one of the most powerful civilizations of the ancient world has been hiding in plain sight? Beyond the familiar names of Egypt, Greece and Rome, another world was rising—building cities, commanding armies, shaping trade and leaving monuments that still challenge what we think we know about the ancient past.\n\nINTRODUCTION\nThis documentary follows the story of ${D.topic}. We will explore its landscape, rulers, people, culture, conflicts and legacy while separating established evidence from historical uncertainty.\n\nCHAPTER 1 — THE WORLD THAT CREATED THE KINGDOM\nCivilizations do not appear from nowhere. They emerge from landscapes that provide opportunity and impose limits. Explain the rivers, deserts, agricultural zones and trade routes that shaped the civilization.\n\nCHAPTER 2 — RISE OF POWER\nIntroduce the political consolidation of the kingdom and the rulers supported by evidence. Explain how military power, religion, agriculture and trade reinforced one another.\n\nCHAPTER 3 — CONFLICT WITH GREAT POWERS\nBuild the central dramatic conflict. Explain competing interests, campaigns and the evidence behind ancient accounts. Avoid presenting later legends as proven fact.\n\nCHAPTER 4 — PEOPLE AND CULTURE\nMove beyond kings. Explore farmers, artisans, soldiers, merchants, priests and royal women. Discuss architecture, burial traditions, art, technology and trade.\n\nCHAPTER 5 — CITIES, TRADE AND WEALTH\nShow how goods and ideas moved through the region and how economic power influenced politics.\n\nCHAPTER 6 — ROYAL WOMEN AND LEADERSHIP\nExamine powerful women where evidence permits, distinguishing archaeological evidence from interpretation.\n\nCHAPTER 7 — DECLINE AND TRANSFORMATION\nExplain the political, environmental, economic and military pressures supported by scholarship. Ancient civilizations rarely simply disappear; institutions, people and traditions can continue in new forms.\n\nENDING\nThe ancient world was never a simple collection of isolated civilizations. It was a network of peoples connected by rivers, deserts, trade and conflict. The story of ${D.topic} reminds us that history is also what archaeologists recover from the ground and what careful scholarship can reconstruct from incomplete evidence.\n\nEND CARD\nTHE WORLD BEFORE US\nAncient civilizations. Forgotten stories. Evidence brought to life.`;render();document.getElementById('status').textContent='Documentary package generated.'}function render(){let o='';if(current==='script')o=D.script||'Generate a documentary first.';if(current==='scenes')o=(D.scenes||[]).map(s=>`SCENE ${s.num} — ${s.title}\nDuration: approximately ${Math.max(1,Math.round(D.length/9))} minute(s)\nNarration: Establish the historical context and connect this chapter to ${D.topic}.\nVisual: Cinematic, archaeologically grounded reconstruction; realistic ancient landscape, architecture, clothing and people; documentary realism; 16:9.`).join('\n\n--------------------\n\n');if(current==='visuals')o=(D.scenes||[]).map(s=>`SCENE ${s.num} — ${s.title}\nCinematic historical reconstruction of ${D.topic}; ancient landscape; archaeologically grounded architecture and clothing; realistic human figures; dramatic natural light; slow camera movement; no modern objects; documentary realism; 16:9.`).join('\n\n--------------------\n\n');if(current==='audio')o=(D.scenes||[]).map(s=>`SCENE ${s.num} — ${s.title}\nVOICE: Calm, authoritative documentary narrator. Moderate pace.\nMUSIC: Subtle historical documentary score with restrained percussion and ambient atmosphere.\nSFX: Wind, footsteps, water, birds, marketplace or battlefield ambience where appropriate.\nMIX: Narration clearly above music.`).join('\n\n--------------------\n\n');if(current==='plan')o=`PRODUCTION PLAN\n\nTITLE\n${D.topic}\n\nTARGET LENGTH\n${D.length} minutes\n\nWORKFLOW\n1. Research and fact-check claims.\n2. Record or generate narration.\n3. Generate visuals scene by scene.\n4. Add maps, archaeological imagery and inscriptions where appropriate.\n5. Add music and environmental sound.\n6. Edit visuals to narration.\n7. Add subtitles and chapter cards.\n8. Review historical claims before publishing.\n9. Export in 1080p or higher.\n\nACCURACY RULE\nDo not invent quotations, dates, identities, buildings or events. Where evidence is uncertain, say that scholars debate the issue or that evidence is incomplete.`;document.getElementById('output').textContent=o}function tab(t,b){current=t;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function copyText(){navigator.clipboard.writeText(document.getElementById('output').innerText).then(()=>alert('Copied.'))}function downloadText(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([document.getElementById('output').innerText],{type:'text/plain'}));a.download='documentary.txt';a.click()}</script></body></html>
